# Lint, typecheck, unit and browser tests on every push and pull request
# to main (TSK-961148). The browser tests run the real pages against the
# mocked backend in tests/e2e/mock.ts: nothing reaches the real API.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests (mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests use the system Chrome (channel "chrome"), already on the runner.
      - run: node scripts/copy-mediapipe.mjs
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/
          retention-days: 7
